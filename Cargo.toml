[package]
name = "maxwells-daemon"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Maxwell's Daemon: a measure-first SWE agent harness with runtime MCP toolsets and inspectable trajectories"
license = "MIT"

[lib]
name = "maxwells_daemon"
path = "src/lib.rs"

[[bin]]
name = "max"
path = "src/main.rs"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }
futures = "0.3"
async-trait = "0.1"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
regex = "1"

# Errors / logging
thiserror = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Templates & config
minijinja = { version = "2", features = ["loader"] }

# CLI
clap = { version = "4", features = ["derive", "env"] }
dialoguer = "0.11"
indicatif = "0.18.4"
# `mini --interactive` confirmation prompt: single-key reads on a TTY plus
# a ratatui dashboard when `--ui ratatui` is selected (issue #312).
crossterm = { version = "0.28", features = ["event-stream"] }
ratatui = "0.29"

# HTTP fallback (used inside `LitellmBackend` for headers, and as a thin
# escape hatch if any backend needs raw HTTP).
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# Multi-provider LLM dispatch. Default features pull in the gateway server
# stack (actix-web, sea-orm, redis); we want only the library API
# (`completion`, `system_message`, `user_message`, response types,
# CacheControl). `default-features = false` strips the gateway.
litellm-rs = { version = "0.4.16", default-features = false }

# Misc
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
similar = "2"
comfy-table = "7.2.2"
tempfile = "3"
flate2 = "1.1"
tar = "0.4"

# NOTE on model backend:
# `litellm-rs` ships a library API (`completion`, message constructors,
# response types, CacheControl) AND a gateway binary. The default features
# build the gateway, which drags in actix-web/sea-orm/redis. We disable
# default features to keep just the library surface — multi-provider
# dispatch behind a single `completion()` call, which is what we want.

[dev-dependencies]
proptest = "1"
insta = { version = "1", features = ["json"] }
pretty_assertions = "1"
tokio = { version = "1", features = ["full", "test-util"] }

[features]
default = ["webhook"]
docker = []
chaos = []
live-anthropic = []
markdown-export = []
html-export = []
webhook = []
csv-export = []
mermaid-export = []
junit-export = []

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
# Overly noisy / low-value pedantic lints:
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
doc_markdown = "allow"
doc_lazy_continuation = "allow"
too_long_first_doc_paragraph = "allow"
needless_raw_string_hashes = "allow"
missing_const_for_fn = "allow"
struct_field_names = "allow"
default_trait_access = "allow"
option_if_let_else = "allow"
# Correctness-style lints: keep strict in lib code.
unwrap_used = "deny"
expect_used = "deny"
