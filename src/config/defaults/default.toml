# Default config for Maxwell's Daemon. Mirrors mini-swe-agent's
# `config/mini.yaml` in shape. Fields documented inline.

[agent]
# Which agent impl to instantiate. One of: "default", "interactive".
kind = "default"
# Max conversational steps. Prevents runaway loops.
step_limit = 50
# Template rendered when the model's response contains no valid action.
format_error_template = '''
Your response did not include a valid tool call. Respond with a single
```bash
# command here
```
block (or another listed tool block), or the sentinel
`COMPLETE_TASK_AND_SUBMIT_FINAL_OUTPUT` on its own line followed by the final
output block.
'''
# Template rendered over each command's RunResult to form the next
# user-observation message. `pre_tool_use_hooks` and
# `post_tool_use_hooks` are populated by `[[agent.hooks.*]]` entries.
observation_template = '''
{% if tool_use_blocked %}
Tool use blocked by PreToolUse hook.

{% endif %}
Exit code: {{ returncode }}
Output:
{{ output }}
{% if pre_tool_use_hooks %}

PreToolUse hooks:
{% for hook in pre_tool_use_hooks %}
[{{ hook.name }}] exit_code={{ hook.exit_code }} timed_out={{ hook.timed_out }}
{% if hook.stdout %}stdout:
{{ hook.stdout }}{% endif %}
{% if hook.stderr %}stderr:
{{ hook.stderr }}{% endif %}
{% endfor %}
{% endif %}
{% if post_tool_use_hooks %}

PostToolUse hooks:
{% for hook in post_tool_use_hooks %}
[{{ hook.name }}] exit_code={{ hook.exit_code }} timed_out={{ hook.timed_out }}
{% if hook.stdout %}stdout:
{{ hook.stdout }}{% endif %}
{% if hook.stderr %}stderr:
{{ hook.stderr }}{% endif %}
{% endfor %}
{% endif %}
'''
observation_max_bytes = 16384
observation_head_ratio = 0.5

# Default timeout for tool hooks unless a hook overrides `timeout_secs`.
tool_hook_timeout_secs = 10
#
# Extra action-text command regex patterns recognized as test invocations.
# Values extend the closed default list documented in
# docs/spec-test-telemetry.md. Set `test_command_patterns_replace = true`
# only when you want to disable the built-in SWE-bench ecosystem list.
# test_command_patterns = ["project-(check|test)"]
# test_command_patterns_replace = false
#
# Optional tool hooks. PreToolUse hooks run before each bash command; a
# nonzero exit code or timeout blocks the command and reports the hook result
# to the model. PostToolUse hooks run after successful command execution and
# are diagnostic only.
#
# [[agent.hooks.pre_tool_use]]
# name = "guard"
# command = "test \"$MAXWELL_COMMAND\" != \"rm -rf /\""
# timeout_secs = 5
#
# [[agent.hooks.post_tool_use]]
# name = "git-status"
# command = "git status --short"
#
# Optional invocation-time MCP stdio servers. Each server is initialized with
# MCP JSON-RPC, exposes tools through `tools/list`, and receives `tools/call`
# requests when the assistant uses one of those tools.
#
# [[agent.mcp_servers]]
# command = "diagnostic-mcp"
# timeout_secs = 30
#
# Low-level command adapter escape hatch. Prefer `agent.mcp_servers` for A/B
# toolset experiments; this only maps a fenced tool block to one command.
#
# [[agent.tools]]
# name = "diagnose"
# description = "Run a repository diagnostic helper."
# command = "diagnose-helper"
# timeout_secs = 30

[model]
# String name. Routed by prefix to backend (claude* -> Anthropic).
name = "claude-opus-4-7"
# temperature omitted — uses backend default (maps to null in schema)
max_tokens = 4096

[environment]
# "local" or "docker".
kind = "local"
# Per-command timeout in seconds.
timeout_secs = 60
workdir = "/workspace"

[sweep]
# Adaptive rate-limit governor (issue #44). Both keys are opt-in: when unset,
# no ceiling is applied and behavior is identical to pre-#44 builds.
#
# Cap aggregate provider *requests per minute* across all parallel workers.
# Maps to --max-rpm on the CLI. CLI value always wins over this key.
# max_rpm = 4000
#
# Cap aggregate *input tokens per minute* across all parallel workers.
# Maps to --max-input-tpm on the CLI. CLI value always wins over this key.
# max_input_tpm = 400000

[redaction]
# Secret redaction is enabled by default for trajectories, model-visible
# observations, streams, inspect/export output, and submission artifacts.
enabled = true
#
# Add per-run literals and regexes here or in an overlay config. Literal values
# are redacted from resolved config manifests before they are written.
# secret_literals = ["actual-token-value"]
# custom_patterns = ["INTERNAL-TOKEN-[A-Za-z0-9]{24}"]
#
# Unsafe escape hatch: when false, submitted patches/prediction artifacts that
# contain configured literals or structured secret shapes are downgraded to
# failure_category = "secret_leak_detected". Leave this off unless you are
# intentionally producing a private, non-shareable artifact.
unsafe_allow_secret_leaks = false

[skills]
# Harness-level agent skills are private by default: the harness scans the
# configured paths, selects relevant skills, and injects only active skill
# bodies into the run's extra context.
enabled = false
auto_load = true
paths = []
max_active = 4

[prompts]
system = '''
You are a skilled software engineer working at a terminal. You have
access to these tools:
{% for tool in tools %}
- `{{ tool.name }}`: {{ tool.description }}
{% if tool.input_schema %}  Input JSON schema: {{ tool.input_schema }}
{% endif %}
{% endfor %}

Each response must contain exactly one action:
either a single fenced block for one listed tool, or the literal sentinel
`COMPLETE_TASK_AND_SUBMIT_FINAL_OUTPUT` on its own line followed by a
final output block.

Do not install dependencies unless they are strictly required to produce the
final patch. Prefer inspecting code and tests already present in the repository.
If a local dependency problem blocks validation, explain it briefly and continue
with the patch. Once you have a useful patch, submit it instead of continuing
exploratory work.
'''
instance = '''
Task: {{ task }}
{% if extra_context %}
Additional context:
{{ extra_context }}
{% endif %}
'''
